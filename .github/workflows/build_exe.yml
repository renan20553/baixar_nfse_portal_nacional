name: Build Windows executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Avoid the Python 3.15 abi3t DLL layout used by the failing bundle.
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt
          python -m pip check

      - name: Run regression tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate version
        shell: bash
        run: echo "APP_VERSION=0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Write version file
        shell: bash
        run: |
          echo "__version__ = '${APP_VERSION}'" > version.py
          cat <<EOF > version_file.txt
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, ${APP_VERSION#0.}, 0, 0),
              prodvers=(0, ${APP_VERSION#0.}, 0, 0),
              mask=0x3F,
              flags=0x0,
              OS=0x4,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  '041604B0',
                  [
                    StringStruct('CompanyName', 'Renan R. Santos'),
                    StringStruct('FileDescription', 'Download NFS-e Portal Nacional'),
                    StringStruct('FileVersion', '${APP_VERSION}'),
                    StringStruct('ProductVersion', '${APP_VERSION}'),
                    StringStruct('InternalName', 'download_nfse'),
                    StringStruct('OriginalFilename', 'download_nfse.exe'),
                    StringStruct('ProductName', 'Download NFS-e Portal Nacional')
                  ]
                )
              ]),
              VarFileInfo([VarStruct('Translation', [0x0416, 0x04B0])])
            ]
          )
          EOF

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller --clean --onefile --noconsole --noupx \
            --version-file version_file.txt download_nfse.py
          cp config.json dist/
          mv dist/download_nfse.exe dist/download_nfse_${APP_VERSION}.exe
          ls -R dist

      - name: Test packaged executable without installed Python
        shell: bash
        run: |
          python scripts/check_windows_executable.py \
            "dist/download_nfse_${APP_VERSION}.exe" --report dist/self-test.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: download_nfse_${{ env.APP_VERSION }}
          path: dist/

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          files: dist/download_nfse_${{ env.APP_VERSION }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}
